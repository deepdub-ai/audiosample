[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "audiosample-rs-dev"
version = "0.2.0"
description = "Standalone dev build of audiosample native extension. Use root pyproject.toml for production."
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Nir Krakowski", email = "nir@deepdub.ai" },
]

[tool.maturin]
features = ["python", "extension-module"]
module-name = "audiosample._rs"
